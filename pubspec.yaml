name: twoalogisticcabineuser
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.51+82

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared package with common models and services
  twoalogistic_shared:
    path: ../2a-shared

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  video_player: ^2.10.1
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  dio: ^5.8.2
  path_provider: ^2.1.5
  device_info_plus: ^11.5.0
  crypto: ^3.0.3
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  # Camera barcode capture for SP Organizer. Keep aligned with 2a-admin.
  mobile_scanner: ^7.1.4
  # Нативное сжатие в WebP/JPEG перед upload (iOS/Android libwebp).
  # Даёт −70-80% трафика для китайских клиентов.
  flutter_image_compress: ^2.3.0
  # flutter_native_splash: ^2.4.4 # Temporarily disabled due to compileSdk issue
  flutter_chat_ui: ^2.11.1
  flutter_chat_types: ^3.6.2
  flutter_chat_core: ^2.9.0
  uuid: ^4.5.2
  flutter_local_notifications: ^19.5.0
  gal: ^2.3.2
  
  # Photo viewer for fullscreen images
  photo_view: ^0.15.0
  flutter_pdfview: ^1.4.4
  
  # Showcase/Onboarding
  tutorial_coach_mark: ^1.3.3
  
  # Firebase & Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  
  # Phone input mask
  mask_text_input_formatter: ^2.9.0
  phone_form_field: ^10.0.17
  flutter_markdown_plus: ^1.0.7
  http_parser: ^4.1.2

  # Error tracking
  sentry_flutter: ^9.20.0
  flutter_cache_manager: ^3.4.1

  # Analytics
  appmetrica_plugin: ^3.4.0

  # App Tracking Transparency (ATT) for iOS
  app_tracking_transparency: ^2.0.6

  # App version info
  package_info_plus: ^8.3.0

  # QR code generation for USDT payments
  qr_flutter: ^4.1.0
  http: ^1.6.0
  cupertino_http: ^3.0.2
  cronet_http: ^1.6.0
  passkeys: ^2.17.4

dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.13
  mocktail: ^1.0.4

  # Icon generator
  flutter_launcher_icons: ^0.14.3

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "icon.png"
  # iOS specific (no transparency allowed)
  remove_alpha_ios: true
  # Adaptive icon for Android 8+
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/gilroy/Gilroy-Light.ttf
          weight: 300
        - asset: assets/fonts/gilroy/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/gilroy/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/gilroy/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/gilroy/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/gilroy/Gilroy-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/gilroy/Gilroy-Black.ttf
          weight: 900
        - asset: assets/fonts/gilroy/Gilroy-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/gilroy/Gilroy-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/gilroy/Gilroy-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/gilroy/Gilroy-BoldItalic.ttf
          weight: 700
          style: italic
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Native splash screen configuration
flutter_native_splash:
  color: "#F8F8F8"
  android_12:
    color: "#F8F8F8"
  ios: true
  android: true
  web: false

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
  project: 2a-user
  org: sentry
